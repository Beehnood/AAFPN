name: AAFPN CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # FRONTEND
  # =====================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build


  # =====================================================
  # BACKEND
  # =====================================================
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build


  # =====================================================
  # DEPLOYMENT
  # =====================================================
  deploy:
    name: Check Production SSH

    needs:
      - frontend
      - backend

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}
      ORACLE_SSH_PORT: ${{ secrets.ORACLE_SSH_PORT || vars.ORACLE_SSH_PORT || '22' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          set -euo pipefail
          for variable in SSH_PRIVATE_KEY ORACLE_HOST ORACLE_USER; do
            if [[ -z "${!variable}" ]]; then
              echo "::error::Configuration SSH manquante : $variable (SSH_PRIVATE_KEY correspond au secret ORACLE_SSH_KEY)."
              exit 1
            fi
          done
          if [[ ! "$ORACLE_SSH_PORT" =~ ^[0-9]{1,5}$ ]] || (( 10#$ORACLE_SSH_PORT < 1 || 10#$ORACLE_SSH_PORT > 65535 )); then
            echo "::error::ORACLE_SSH_PORT doit être un nombre entre 1 et 65535."
            exit 1
          fi
          if [[ "$ORACLE_HOST" == *://* || "$ORACLE_HOST" == *[[:space:]]* || "$ORACLE_HOST" == -* ]]; then
            echo "::error::ORACLE_HOST doit contenir uniquement une adresse IP ou un nom DNS, sans protocole ni espaces."
            exit 1
          fi
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$SSH_PRIVATE_KEY" | tr -d '\r' > ~/.ssh/aafpn_key
          chmod 600 ~/.ssh/aafpn_key
          if ! ssh-keygen -y -P '' -f ~/.ssh/aafpn_key > /dev/null 2>&1; then
            echo "::error::ORACLE_SSH_KEY est invalide ou protégée par une phrase secrète. Fournir une clé privée de déploiement utilisable sans interaction."
            exit 1
          fi

          if ! ssh-keyscan -T 10 -p "$ORACLE_SSH_PORT" "$ORACLE_HOST" > ~/.ssh/aafpn_known_hosts 2>/dev/null || [[ ! -s ~/.ssh/aafpn_known_hosts ]]; then
            echo "::error::Impossible de récupérer la clé du serveur SSH. Vérifier ORACLE_HOST, ORACLE_SSH_PORT, le service SSH et les règles réseau Oracle/pare-feu."
            exit 1
          fi
          chmod 600 ~/.ssh/aafpn_known_hosts

      - name: Test Oracle SSH connection
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/aafpn_known_hosts" \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/aafpn_key \
            -p "$ORACLE_SSH_PORT" \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'SSH connection successful' && hostname && whoami && pwd"
