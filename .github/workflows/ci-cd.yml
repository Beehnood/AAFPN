name: AAFPN CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # =====================================================
  # FRONTEND CI
  # =====================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build


  # =====================================================
  # BACKEND CI
  # =====================================================
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build


  # =====================================================
  # PRODUCTION DEPLOYMENT
  # =====================================================
  deploy:
    name: Deploy Production

    needs:
      - frontend
      - backend

    # Déploiement uniquement sur main
    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-24.04
    timeout-minutes: 20

    environment:
      name: production

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}

    steps:

      # -------------------------------------------------
      # CHECKOUT
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # CHECK SECRETS
      # -------------------------------------------------
      - name: Check deployment variables
        env:
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -e

          echo "======================================"
          echo "CHECK DEPLOYMENT VARIABLES"
          echo "======================================"

          if [ -z "$ORACLE_HOST" ]; then
            echo "::error::ORACLE_HOST is missing"
            exit 1
          fi

          if [ -z "$ORACLE_USER" ]; then
            echo "::error::ORACLE_USER is missing"
            exit 1
          fi

          if [ -z "$ORACLE_SSH_KEY_B64" ]; then
            echo "::error::ORACLE_SSH_KEY_B64 is missing"
            exit 1
          fi

          echo "ORACLE_HOST: OK"
          echo "ORACLE_USER: OK"
          echo "ORACLE_SSH_KEY_B64: OK"
          echo "SSH PORT: 22"


      # -------------------------------------------------
      # CONFIGURE SSH
      # -------------------------------------------------
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURE SSH"
          echo "======================================"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$ORACLE_SSH_KEY_B64" \
            | base64 --decode \
            > "$HOME/.ssh/aafpn_key"

          chmod 600 "$HOME/.ssh/aafpn_key"

          echo "SSH private key decoded."


      # -------------------------------------------------
      # VALIDATE PRIVATE KEY
      # -------------------------------------------------
      - name: Validate SSH private key
        run: |
          set -e

          echo "======================================"
          echo "VALIDATE SSH PRIVATE KEY"
          echo "======================================"

          ssh-keygen -y \
            -f "$HOME/.ssh/aafpn_key" \
            > /dev/null

          echo "SSH private key: VALID"


      # -------------------------------------------------
      # REGISTER ORACLE HOST
      # -------------------------------------------------
      - name: Scan Oracle SSH host
        run: |
          set -e

          echo "======================================"
          echo "SCAN ORACLE SSH HOST"
          echo "======================================"

          ssh-keyscan \
            -T 15 \
            -p 22 \
            "$ORACLE_HOST" \
            > "$HOME/.ssh/known_hosts"

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::Unable to retrieve Oracle SSH host key"
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Oracle SSH host: OK"


      # -------------------------------------------------
      # TEST SSH
      # -------------------------------------------------
      - name: Test Oracle SSH connection
        run: |
          set -e

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/aafpn_key" \
            -p 22 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'SSH connection successful' && hostname && whoami"


      # -------------------------------------------------
      # DEPLOY APPLICATION
      # -------------------------------------------------
      - name: Deploy AAFPN to Oracle Cloud
        run: |
          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/aafpn_key" \
            -p 22 \
            "$ORACLE_USER@$ORACLE_HOST" << 'EOF'

            set -e

            echo "======================================"
            echo "AAFPN PRODUCTION DEPLOYMENT"
            echo "======================================"

            cd /var/www/aafpn


            # ==========================================
            # UPDATE SOURCE CODE
            # ==========================================

            echo ""
            echo "--------------------------------------"
            echo "Updating repository"
            echo "--------------------------------------"

            git fetch origin main

            git checkout main

            git reset --hard origin/main

            echo "Repository updated."


            # ==========================================
            # FRONTEND
            # ==========================================

            echo ""
            echo "--------------------------------------"
            echo "Building frontend"
            echo "--------------------------------------"

            cd /var/www/aafpn/frontend

            npm ci

            npm run build

            echo "Frontend build completed."


            # ==========================================
            # BACKEND
            # ==========================================

            echo ""
            echo "--------------------------------------"
            echo "Building backend"
            echo "--------------------------------------"

            cd /var/www/aafpn/backend

            npm ci

            echo "Generating Prisma Client..."

            npx prisma generate

            echo "Running database migrations..."

            npx prisma migrate deploy

            echo "Building TypeScript..."

            npm run build

            echo "Backend build completed."


            # ==========================================
            # RESTART BACKEND WITH PM2
            # ==========================================

            echo ""
            echo "--------------------------------------"
            echo "Restarting backend"
            echo "--------------------------------------"

            pm2 restart aafpn-backend --update-env

            pm2 save

            echo "Backend restarted."


            # ==========================================
            # NGINX
            # ==========================================

            echo ""
            echo "--------------------------------------"
            echo "Checking Nginx"
            echo "--------------------------------------"

            sudo nginx -t

            echo "Reloading Nginx..."

            sudo systemctl reload nginx


            # ==========================================
            # STATUS
            # ==========================================

            echo ""
            echo "--------------------------------------"
            echo "PM2 status"
            echo "--------------------------------------"

            pm2 status


            echo ""
            echo "======================================"
            echo "AAFPN DEPLOYMENT SUCCESSFUL"
            echo "======================================"

          EOF