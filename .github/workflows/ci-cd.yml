name: AAFPN CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read


jobs:

  # =====================================================
  # FRONTEND CI
  # =====================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build


  # =====================================================
  # BACKEND CI
  # =====================================================
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build


  # =====================================================
  # PRODUCTION SSH CHECK
  # =====================================================
  deploy:
    name: Check Production SSH

    needs:
      - frontend
      - backend

    if: >
      (github.event_name == 'push' &&
       github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' &&
       github.ref == 'refs/heads/main')

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: production

    env:
      ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
      ORACLE_USER: ${{ secrets.ORACLE_USER }}

    steps:

      # -------------------------------------------------
      # Checkout
      # -------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # -------------------------------------------------
      # Vérification des secrets
      # -------------------------------------------------
      - name: Check deployment variables
        env:
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -e

          echo "======================================"
          echo "CHECK DEPLOYMENT VARIABLES"
          echo "======================================"

          if [ -n "$ORACLE_HOST" ]; then
            echo "ORACLE_HOST: OK"
          else
            echo "::error::ORACLE_HOST is missing"
            exit 1
          fi

          if [ -n "$ORACLE_USER" ]; then
            echo "ORACLE_USER: OK"
          else
            echo "::error::ORACLE_USER is missing"
            exit 1
          fi

          if [ -n "$ORACLE_SSH_KEY_B64" ]; then
            echo "ORACLE_SSH_KEY_B64: OK"
          else
            echo "::error::ORACLE_SSH_KEY_B64 is missing"
            exit 1
          fi

          echo "SSH PORT: 22"
          echo "======================================"
          echo "ALL VARIABLES: OK"
          echo "======================================"


      # -------------------------------------------------
      # Décodage de la clé SSH Base64
      # -------------------------------------------------
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURE SSH"
          echo "======================================"

          mkdir -p "$HOME/.ssh"
          chmod 700 "$HOME/.ssh"

          printf '%s' "$ORACLE_SSH_KEY_B64" \
            | base64 --decode \
            > "$HOME/.ssh/aafpn_key"

          chmod 600 "$HOME/.ssh/aafpn_key"

          echo "SSH private key decoded."


      # -------------------------------------------------
      # Validation de la clé privée
      # -------------------------------------------------
      - name: Validate SSH private key
        run: |
          set -e

          echo "======================================"
          echo "VALIDATE SSH PRIVATE KEY"
          echo "======================================"

          if ssh-keygen -y \
            -f "$HOME/.ssh/aafpn_key" \
            > /dev/null 2>&1
          then
            echo "SSH private key: VALID"
          else
            echo "::error::SSH private key is invalid"
            exit 1
          fi


      # -------------------------------------------------
      # Scan serveur Oracle
      # -------------------------------------------------
      - name: Scan Oracle SSH host
        run: |
          set -e

          echo "======================================"
          echo "SCAN ORACLE SSH HOST"
          echo "======================================"

          ssh-keyscan \
            -T 15 \
            -p 22 \
            "$ORACLE_HOST" \
            > "$HOME/.ssh/known_hosts"

          if [ ! -s "$HOME/.ssh/known_hosts" ]; then
            echo "::error::Unable to retrieve Oracle SSH host key"
            exit 1
          fi

          chmod 600 "$HOME/.ssh/known_hosts"

          echo "Oracle SSH host: OK"


      # -------------------------------------------------
      # Test connexion Oracle
      # -------------------------------------------------
      - name: Test Oracle SSH connection
        run: |
          set -e

          echo "======================================"
          echo "TEST ORACLE SSH CONNECTION"
          echo "======================================"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -i "$HOME/.ssh/aafpn_key" \
            -p 22 \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'SSH connection successful' && hostname && whoami && pwd"