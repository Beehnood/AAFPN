name: AAFPN CI/CD

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"

  pull_request:
    branches:
      - main
      - develop

  workflow_dispatch:

permissions:
  contents: read

jobs:

  # =====================================================
  # FRONTEND
  # =====================================================
  frontend:
    name: Frontend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

      - name: Build frontend
        run: npm run build


  # =====================================================
  # BACKEND
  # =====================================================
  backend:
    name: Backend Tests & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Tests
        run: npm test --if-present

      - name: Build backend
        run: npm run build


  # =====================================================
  # SSH / PRODUCTION CHECK
  # =====================================================
  deploy:
    name: Check Production SSH

    needs:
      - frontend
      - backend

    # Seulement après un push sur main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    runs-on: ubuntu-24.04
    timeout-minutes: 10

    environment:
      name: production

    steps:

      # ------------------------------------------
      # Checkout
      # ------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------
      # Vérifier les secrets
      # ------------------------------------------
      - name: Check deployment variables
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
          ORACLE_SSH_KEY: ${{ secrets.ORACLE_SSH_KEY }}
        run: |
          echo "======================================"
          echo "CHECK DEPLOYMENT VARIABLES"
          echo "======================================"

          if [ -n "$ORACLE_HOST" ]; then
            echo "ORACLE_HOST: OK"
          else
            echo "::error::ORACLE_HOST is missing"
            exit 1
          fi

          if [ -n "$ORACLE_USER" ]; then
            echo "ORACLE_USER: OK"
          else
            echo "::error::ORACLE_USER is missing"
            exit 1
          fi

          if [ -n "$ORACLE_PORT" ]; then
            echo "ORACLE_PORT: OK"
          else
            echo "::error::ORACLE_PORT is missing"
            exit 1
          fi

          if [ -n "$ORACLE_SSH_KEY" ]; then
            echo "ORACLE_SSH_KEY: OK"
          else
            echo "::error::ORACLE_SSH_KEY is missing"
            exit 1
          fi

          echo "All deployment variables are available."


      # ------------------------------------------
      # Préparer la clé SSH
      # ------------------------------------------
      - name: Configure SSH
        env:
          ORACLE_SSH_KEY_B64: ${{ secrets.ORACLE_SSH_KEY_B64 }}
        run: |
          set -e

          echo "======================================"
          echo "CONFIGURE SSH"
          echo "======================================"

          mkdir -p ~/.ssh

          chmod 700 ~/.ssh

          printf '%s' "$ORACLE_SSH_KEY_B64" \
            | base64 --decode \
            > ~/.ssh/aafpn_key

          chmod 600 ~/.ssh/aafpn_key

          echo "Private key file created."


      # ------------------------------------------
      # Vérifier que la clé privée est valide
      # ------------------------------------------
      - name: Validate SSH private key
        run: |
          echo "======================================"
          echo "VALIDATE SSH PRIVATE KEY"
          echo "======================================"

          if ssh-keygen -y \
            -f ~/.ssh/aafpn_key \
            > /dev/null 2>&1; then

            echo "SSH private key: VALID"

          else

            echo "::error::SSH private key is invalid or password protected"
            exit 1

          fi


      # ------------------------------------------
      # Vérifier que le serveur SSH répond
      # ------------------------------------------
      - name: Scan Oracle SSH host
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          echo "======================================"
          echo "SCAN ORACLE SSH HOST"
          echo "======================================"

          if ssh-keyscan \
            -T 15 \
            -p "$ORACLE_PORT" \
            "$ORACLE_HOST" \
            > ~/.ssh/known_hosts 2>/dev/null; then

            echo "Oracle SSH server found"

          else

            echo "::error::Unable to reach Oracle SSH server"
            exit 1

          fi

          if [ ! -s ~/.ssh/known_hosts ]; then
            echo "::error::known_hosts is empty"
            exit 1
          fi

          chmod 600 ~/.ssh/known_hosts


      # ------------------------------------------
      # Tester la connexion SSH complète
      # ------------------------------------------
      - name: Test Oracle SSH connection
        env:
          ORACLE_HOST: ${{ secrets.ORACLE_HOST }}
          ORACLE_USER: ${{ secrets.ORACLE_USER }}
          ORACLE_PORT: ${{ secrets.ORACLE_PORT }}
        run: |
          echo "======================================"
          echo "TEST ORACLE SSH CONNECTION"
          echo "======================================"

          ssh \
            -o BatchMode=yes \
            -o ConnectTimeout=15 \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
            -o IdentitiesOnly=yes \
            -i ~/.ssh/aafpn_key \
            -p "$ORACLE_PORT" \
            "$ORACLE_USER@$ORACLE_HOST" \
            "echo 'SSH connection successful' && hostname && whoami && pwd"