name: AAFPN FRONTEND CI

on:
  push:
    branches:
      - main
      - develop
      - "feature/**"
    paths:
      - "frontend/**"
      - ".github/workflows/front-ci.yml"

  pull_request:
    branches:
      - main
      - develop
    paths:
      - "frontend/**"
      - ".github/workflows/front-ci.yml"

  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend - Lint & Build
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Tests
        run: npm test --if-present

      - name: Build
        run: npm run build